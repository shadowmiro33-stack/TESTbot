packages:
  - apps/*
  - packages/*

overrides:
  typescript: 5.9.3

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  embedded-postgres: true
  '@embedded-postgres/windows-x64': true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - embedded-postgres
  - '@embedded-postgres/windows-x64'
  - sharp
